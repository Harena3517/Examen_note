<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Saisie Demande | ForagePro</title>
</head>

<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/demandes}"
                        class="btn btn-link link-secondary p-0 me-3 text-decoration-none shadow-none">
                        <i class="bi bi-arrow-left fs-4"></i>
                    </a>
                    <h1 class="h3 mb-0 fw-bold text-dark"
                        th:text="${demande.idDemande == null} ? 'Nouvelle Demande' : 'Modifier la Demande'"></h1>
                </div>

                <div class="card card-premium p-4 p-md-5 border-0">
                    <form th:action="@{/demandes/save}" th:object="${demande}" method="post">
                        <input type="hidden" th:field="*{idDemande}">

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="dateDemande"
                                    class="form-label fw-semibold text-secondary small text-uppercase">Date et Heure de
                                    la
                                    demande</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 opacity-75"><i
                                            class="bi bi-calendar-event text-primary"></i></span>
                                    <input type="datetime-local"
                                        class="form-control border-start-0 ps-0 bg-light bg-opacity-50" id="dateDemande"
                                        name="dateDemande"
                                        th:value="${demande.dateDemande != null ? #temporals.format(demande.dateDemande, 'yyyy-MM-dd''T''HH:mm') : ''}"
                                        required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="client"
                                    class="form-label fw-semibold text-secondary small text-uppercase">Client
                                    demandeur</label>
                                <select class="form-select bg-light bg-opacity-50" id="client" name="client.idClient"
                                    required>
                                    <option value="">-- Choisir un client --</option>
                                    <option th:each="c : ${clients}" th:value="${c.idClient}"
                                        th:text="${c.nom + ' ' + c.prenom}"
                                        th:selected="${demande.client != null and c.idClient == demande.client.idClient}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="lieu"
                                    class="form-label fw-semibold text-secondary small text-uppercase">Lieu
                                    d'intervention</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 opacity-75"><i
                                            class="bi bi-geo-alt text-danger"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 bg-light bg-opacity-50"
                                        id="lieu" th:field="*{lieu}" placeholder="Adresse ou localité">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="district"
                                    class="form-label fw-semibold text-secondary small text-uppercase">District /
                                    Région</label>
                                <input type="text" class="form-control bg-light bg-opacity-50" id="district"
                                    th:field="*{district}" placeholder="Nom du district">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4 mt-5">
                            <a th:href="@{/demandes}"
                                class="btn btn-link text-decoration-none text-secondary px-4">Annuler</a>
                            <button type="submit" class="btn btn-primary btn-primary-premium px-5 shadow-sm">
                                <i class="bi bi-send me-2"></i>Soumettre la Demande
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
