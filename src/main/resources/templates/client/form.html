<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Fiche Client | ForagePro</title>
</head>

<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/clients}"
                        class="btn btn-link link-secondary p-0 me-3 text-decoration-none shadow-none">
                        <i class="bi bi-arrow-left fs-4"></i>
                    </a>
                    <h1 class="h3 mb-0 fw-bold text-dark"
                        th:text="${client.idClient == null ? 'Nouveau Profil Client' : 'Modifier le Profil'}"></h1>
                </div>

                <div class="card card-premium p-4 p-md-5 border-0">
                    <form th:action="@{/clients/save}" th:object="${client}" method="post">
                        <input type="hidden" th:field="*{idClient}">

                        <div class="mb-4">
                            <label for="nom" class="form-label fw-semibold text-secondary small text-uppercase">Nom de
                                famille</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 opacity-75"><i
                                        class="bi bi-person text-primary"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 bg-light bg-opacity-50"
                                    id="nom" th:field="*{nom}" placeholder="Ex: RAKOTO" required>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label for="prenom"
                                class="form-label fw-semibold text-secondary small text-uppercase">Prénom(s)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 opacity-75"><i
                                        class="bi bi-person-check text-primary"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 bg-light bg-opacity-50"
                                    id="prenom" th:field="*{prenom}" placeholder="Ex: Jean Luc" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4">
                            <a th:href="@{/clients}"
                                class="btn btn-link text-decoration-none text-secondary px-4">Annuler</a>
                            <button type="submit" class="btn btn-primary btn-primary-premium px-5 shadow-sm">
                                <i class="bi bi-save me-2"></i>Enregistrer le Profil
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
