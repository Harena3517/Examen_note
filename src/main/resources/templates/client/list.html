<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Liste des Clients | ForagePro</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1 fw-bold text-dark">Annuaire Clients</h1>
                <p class="text-muted small mb-0">Base de données complète de vos clients partenaires.</p>
            </div>
            <a th:href="@{/clients/add}" class="btn btn-primary btn-primary-premium shadow-sm">
                <i class="bi bi-person-plus-fill me-2"></i>Nouveau Client
            </a>
        </div>

        <div class="card card-premium overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">ID
                            </th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Identité
                                du Client</th>
                            <th class="text-center pe-4 text-uppercase small fw-bold text-secondary"
                                style="font-size: 0.7rem;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="client : ${clients}">
                            <td class="ps-4 text-muted small" th:text="${'#CLT-' + client.idClient}"></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar-circle me-3 bg-primary bg-opacity-10 text-primary fw-bold d-flex align-items-center justify-content-center rounded-circle"
                                        style="width: 40px; height: 40px; font-size: 0.85rem;"
                                        th:text="${#strings.substring(client.nom,0,1) + #strings.substring(client.prenom,0,1)}">
                                    </div>
                                    <div>
                                        <div class="fw-bold text-dark" th:text="${client.nom + ' ' + client.prenom}">
                                        </div>
                                        <div class="text-muted small">Client Partenaire</div>
                                    </div>
                                </div>
                            </td>
                            <td class="text-center pe-4">
                                <div class="btn-group shadow-sm rounded-2 bg-white border">
                                    <a th:href="@{/clients/edit/{id}(id=${client.idClient})}"
                                        class="btn btn-sm btn-link text-warning p-2 px-3 border-end" title="Modifier">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/clients/delete/{id}(id=${client.idClient})}"
                                        class="btn btn-sm btn-link text-danger p-2 px-3"
                                        onclick="return confirm('Supprimer ce client ?')" title="Supprimer">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clients)}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="bi bi-people fs-1 d-block mb-3 opacity-25"></i>
                                <p class="mb-0">Aucun client enregistré pour le moment.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
