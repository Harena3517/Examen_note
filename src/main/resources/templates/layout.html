<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Société Forage</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            padding-top: 80px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-glass">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
                <i class="bi bi-droplet-fill text-primary me-2"></i>
                <span>FORAGE<span class="text-primary text-opacity-75">PRO</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item mx-1"><a class="nav-link" th:href="@{/clients}"><i
                                class="bi bi-people me-1"></i> Clients</a></li>
                    <li class="nav-item mx-1"><a class="nav-link" th:href="@{/demandes}"><i
                                class="bi bi-file-earmark-plus me-1"></i> Demandes</a></li>
                    <li class="nav-item dropdown mx-1">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Devis</a>
                        <ul class="dropdown-menu shadow-lg border-0 rounded-3 mt-2">
                            <li><a class="dropdown-item" th:href="@{/typedevis}"><i
                                        class="bi bi-tag me-2 text-primary"></i> Types</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" th:href="@{/devis}"><i
                                        class="bi bi-file-text me-2 text-primary"></i> Liste Devis</a></li>
                            <li><a class="dropdown-item" th:href="@{/detaildevis}"><i
                                        class="bi bi-list-check me-2 text-primary"></i> Détails</a></li>
                        </ul>
                    </li>
                    <li class="nav-item mx-1"><a class="nav-link text-warning-emphasis" th:href="@{/status}"><i
                                class="bi bi-gear me-1"></i> Config</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div th:insert="~{::content}"></div>
    </main>

    <footer class="mt-auto py-5 text-center text-muted">
        <div class="container">
            <hr class="mb-4">
            <p class="small">&copy; 2026 ForagePro ERP. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
