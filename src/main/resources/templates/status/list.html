<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Liste des Status</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Liste des Status</h1>
            <a th:href="@{/status/add}" class="btn btn-primary">Ajouter un Status</a>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Libellé</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="st : ${statusList}">
                    <td th:text="${st.idStatus}"></td>
                    <td th:text="${st.libelle}"></td>
                    <td>
                        <a th:href="@{/status/edit/{id}(id=${st.idStatus})}" class="btn btn-sm btn-warning">Modifier</a>
                        <a th:href="@{/status/delete/{id}(id=${st.idStatus})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('Supprimer ce status ?')">Supprimer</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
