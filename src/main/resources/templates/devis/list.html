<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Liste des Devis</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1 fw-bold text-dark">Gestion des Devis</h1>
                <p class="text-muted small mb-0">Visualisez et gérez l'ensemble des devis émis.</p>
            </div>
            <a th:href="@{/devis/add}" class="btn btn-primary btn-primary-premium shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Nouveau Devis
            </a>
        </div>

        <div class="card card-premium overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Réf
                                Devis</th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Date
                                d'émission</th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Client /
                                Lieu</th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Type de
                                Prestation</th>
                            <th class="text-center pe-4 text-uppercase small fw-bold text-secondary"
                                style="font-size: 0.7rem;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="devis : ${devisList}">
                            <td class="ps-4 fw-medium text-primary" th:text="${'#DEV-' + devis.idDevis}"></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-calendar3 me-2 text-secondary opacity-50"></i>
                                    <span th:text="${#temporals.format(devis.dateDevis, 'dd MMMM yyyy')}"></span>
                                </div>
                            </td>
                            <td>
                                <div class="fw-semibold text-dark"
                                    th:text="${devis.demande.client.nom + ' ' + devis.demande.client.prenom}"></div>
                                <div class="text-muted small">
                                    <i class="bi bi-geo-alt me-1"></i>
                                    <span th:text="${devis.demande.lieu + ' (' + devis.demande.district + ')'}"></span>
                                </div>
                            </td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2"
                                    style="background-color: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe;"
                                    th:text="${devis.typeDevis.libelle}"></span>
                            </td>
                            <td class="text-center pe-4">
                                <div class="btn-group shadow-sm rounded-2 bg-white border">
                                    <a th:href="@{/devis/edit/{id}(id=${devis.idDevis})}"
                                        class="btn btn-sm btn-link text-warning p-2 px-3 border-end" title="Modifier">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/devis/delete/{id}(id=${devis.idDevis})}"
                                        class="btn btn-sm btn-link text-danger p-2 px-3"
                                        onclick="return confirm('Supprimer ce devis ?')" title="Supprimer">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(devisList)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-3 opacity-25"></i>
                                <p class="mb-0">Aucun devis n'a été enregistré pour le moment.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
