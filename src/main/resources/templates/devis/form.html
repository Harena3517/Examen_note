<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Saisie Devis | ForagePro</title>
</head>

<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/devis}"
                        class="btn btn-link link-secondary p-0 me-3 text-decoration-none shadow-none">
                        <i class="bi bi-arrow-left fs-4"></i>
                    </a>
                    <h1 class="h3 mb-0 fw-bold text-dark"
                        th:text="${devis.idDevis == null} ? 'Nouveau Devis' : 'Modifier le Devis'"></h1>
                </div>

                <div class="card card-premium p-4 p-md-5 border-0">
                    <form th:action="@{/devis/save}" th:object="${devis}" method="post">
                        <input type="hidden" th:field="*{idDevis}">

                        <div class="mb-4">
                            <label for="dateDevis"
                                class="form-label fw-semibold text-secondary small text-uppercase">Date et Heure de
                                facturation</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 opacity-75"><i
                                        class="bi bi-calendar-event text-primary"></i></span>
                                <input type="datetime-local"
                                    class="form-control border-start-0 ps-0 bg-light bg-opacity-50" id="dateDevis"
                                    name="dateDevis"
                                    th:value="${devis.dateDevis != null ? #temporals.format(devis.dateDevis, 'yyyy-MM-dd''T''HH:mm') : ''}"
                                    required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="demande" class="form-label fw-semibold text-secondary small text-uppercase">Lier
                                à une Demande</label>
                            <select class="form-select bg-light bg-opacity-50" id="demande" name="demande.idDemande"
                                required>
                                <option value="">-- Choisir une demande client --</option>
                                <option th:each="d : ${demandes}" th:value="${d.idDemande}"
                                    th:text="${'N°' + d.idDemande + ' - ' + d.lieu}"
                                    th:selected="${devis.demande != null and d.idDemande == devis.demande.idDemande}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label for="typeDevis"
                                class="form-label fw-semibold text-secondary small text-uppercase">Type de
                                Prestation</label>
                            <select class="form-select bg-light bg-opacity-50" id="typeDevis"
                                name="typeDevis.idTypeDevis" required>
                                <option value="">-- Type de prestation --</option>
                                <option th:each="t : ${typeDevisList}" th:value="${t.idTypeDevis}"
                                    th:text="${t.libelle}"
                                    th:selected="${devis.typeDevis != null and t.idTypeDevis == devis.typeDevis.idTypeDevis}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4 mt-5">
                            <a th:href="@{/devis}"
                                class="btn btn-link text-decoration-none text-secondary px-4">Annuler</a>
                            <button type="submit" class="btn btn-primary btn-primary-premium px-5 shadow-sm">
                                <i class="bi bi-check-lg me-2"></i>Enregistrer le Devis
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
