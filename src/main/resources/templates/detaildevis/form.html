<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Formulaire Détail Devis</title>
</head>

<body>
    <div th:fragment="content">
        <h1 th:text="${detail.idDetail == null ? 'Ajouter un Détail' : 'Modifier le Détail'}"></h1>
        <form th:action="@{/detaildevis/save}" th:object="${detail}" method="post" class="mt-4 card p-4 shadow-sm">
            <input type="hidden" th:field="*{idDetail}">

            <div class="mb-3">
                <label for="devis" class="form-label">Devis concerné</label>
                <select class="form-select" id="devis" th:field="*{devis}" required>
                    <option value="">-- Sélectionner un devis --</option>
                    <option th:each="dv : ${devisList}" th:value="${dv.idDevis}"
                        th:text="${'Devis #' + dv.idDevis + ' - ' + dv.demande.lieu}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="libelle" class="form-label">Libellé de la prestation</label>
                <input type="text" class="form-control" id="libelle" th:field="*{libelle}"
                    placeholder="Ex: Tuyauterie, Main d'oeuvre..." required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="montant" class="form-label">Prix Unitaire</label>
                    <div class="input-group">
                        <input type="number" step="0.01" class="form-control" id="montant" th:field="*{montant}"
                            required>
                        <span class="input-group-text">Ar</span>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="qtt" class="form-label">Quantité</label>
                    <input type="number" class="form-control" id="qtt" th:field="*{qtt}" min="1" required>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success px-4">Enregistrer</button>
                <a th:href="@{/detaildevis}" class="btn btn-outline-secondary px-4">Annuler</a>
            </div>
        </form>
    </div>
</body>

</html>
