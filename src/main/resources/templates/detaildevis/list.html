<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

<head>
    <title>Liste des Détails Devis</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1 fw-bold text-dark">Lignes de Détails</h1>
                <p class="text-muted small mb-0">Ventilation détaillée des prestations pour chaque devis.</p>
            </div>
            <a th:href="@{/detaildevis/add}" class="btn btn-primary btn-primary-premium shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Nouvelle Ligne
            </a>
        </div>

        <div class="card card-premium overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">ID
                            </th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">Réf Devis
                            </th>
                            <th class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">
                                Prestation</th>
                            <th class="text-end text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">
                                P.U (Ar)</th>
                            <th class="text-center text-uppercase small fw-bold text-secondary"
                                style="font-size: 0.7rem;">Qtt</th>
                            <th class="text-end text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem;">
                                Total (Ar)</th>
                            <th class="text-center pe-4 text-uppercase small fw-bold text-secondary"
                                style="font-size: 0.7rem;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${details}">
                            <td class="ps-4 text-muted small" th:text="${d.idDetail}"></td>
                            <td>
                                <a th:href="@{/devis/edit/{id}(id=${d.devis.idDevis})}"
                                    class="fw-medium text-decoration-none">
                                    <i class="bi bi-file-text me-1"></i>
                                    <span th:text="${'#DEV-' + d.devis.idDevis}"></span>
                                </a>
                            </td>
                            <td class="fw-semibold text-dark" th:text="${d.libelle}"></td>
                            <td class="text-end text-secondary"
                                th:text="${#numbers.formatDecimal(d.montant, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
                            <td class="text-center"><span class="badge bg-light text-dark border fw-medium"
                                    th:text="${d.qtt}"></span></td>
                            <td class="text-end fw-bold text-primary"
                                th:text="${#numbers.formatDecimal(d.montant * d.qtt, 1, 'WHITESPACE', 2, 'COMMA')}">
                            </td>
                            <td class="text-center pe-4">
                                <div class="btn-group shadow-sm rounded-2 bg-white border">
                                    <a th:href="@{/detaildevis/edit/{id}(id=${d.idDetail})}"
                                        class="btn btn-sm btn-link text-warning p-2 px-3 border-end" title="Modifier">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/detaildevis/delete/{id}(id=${d.idDetail})}"
                                        class="btn btn-sm btn-link text-danger p-2 px-3"
                                        onclick="return confirm('Supprimer cette ligne ?')" title="Supprimer">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(details)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-collection fs-1 d-block mb-3 opacity-25"></i>
                                <p class="mb-0">Aucun détail n'a été enregistré.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
